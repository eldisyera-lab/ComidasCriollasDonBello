<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don Bello - Comidas Criollas Cuba</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #8B4513;
            --color-secondary: #3E1F0A;
            --color-accent: #D2691E;
            --color-gold: #DAA520;
            --color-light: #FFF8DC;
            --color-white: #FFFFFF;
            --color-green: #25D366;
            --color-green-dark: #128C7E;
            --color-red: #DC3545;
            --color-offer: #FF6B35;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-secondary);
            color: var(--color-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: linear-gradient(180deg, var(--color-secondary), #1a0a00);
            z-index: 10001;
            transition: left 0.4s ease;
            box-shadow: 5px 0 25px rgba(0,0,0,0.7);
            overflow-y: auto;
            border-right: 2px solid var(--color-gold);
        }

        .sidebar.open { left: 0; }

        .sidebar-header {
            padding: 25px 20px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border-bottom: 2px solid var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h3 {
            color: var(--color-gold);
            font-size: 1.3rem;
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--color-gold);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .sidebar-close:hover { transform: rotate(90deg); }

        .sidebar-nav {
            padding: 20px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 25px;
            color: var(--color-light);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a:hover {
            background: rgba(218, 165, 32, 0.1);
            border-left-color: var(--color-gold);
            color: var(--color-gold);
            padding-left: 30px;
        }

        .sidebar-nav a i {
            width: 25px;
            text-align: center;
            color: var(--color-gold);
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .header {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            background: none;
            border: 2px solid var(--color-gold);
            color: var(--color-gold);
            width: 45px;
            height: 45px;
            border-radius: 10px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-toggle:hover {
            background: var(--color-gold);
            color: var(--color-secondary);
        }

        .header-brand {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            color: var(--color-gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 3px;
        }

        .header p { color: var(--color-light); font-size: 0.9rem; }

        .header-spacer { width: 45px; }

        .nav-menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
        }

        .nav-menu a {
            color: var(--color-white);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            background: var(--color-primary);
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-menu a:hover {
            background: var(--color-gold);
            color: var(--color-secondary);
            transform: translateY(-2px);
        }

        .section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            color: var(--color-gold);
            margin-bottom: 30px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: var(--color-gold);
            margin: 10px auto;
            border-radius: 2px;
        }

        .special-offers-section {
            background: linear-gradient(145deg, #4A2510, #2D1405);
            border-radius: 20px;
            padding: 30px;
            margin: 30px auto;
            max-width: 1200px;
            border: 2px solid var(--color-gold);
        }

        .special-offers-section h2 {
            color: var(--color-gold);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .offer-card {
            background: linear-gradient(145deg, var(--color-primary), #5D2E0C);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid var(--color-gold);
            display: flex;
            flex-direction: column;
        }

        .offer-card h3 {
            color: var(--color-gold);
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .offer-card p {
            color: #ddd;
            font-size: 0.95rem;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .offer-card .price-tag {
            color: var(--color-gold);
            font-size: 1.4rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .offer-card .not-available-tag {
            color: var(--color-red);
            font-weight: bold;
            font-size: 0.95rem;
            margin: 8px 0;
        }

        .offer-card .tamale-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .offer-card .tamale-input-group input {
            width: 80px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--color-gold);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
        }

        .offer-card .tamale-total {
            color: var(--color-gold);
            font-weight: bold;
        }

        .btn-add-offer {
            width: 100%;
            padding: 12px;
            background: var(--color-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
        }

        .btn-add-offer:hover {
            background: var(--color-green-dark);
            transform: scale(1.02);
        }

        .btn-add-offer.added {
            background: var(--color-red);
        }

        .offer-accordion {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .offer-btn {
            width: 100%;
            padding: 18px 25px;
            background: linear-gradient(135deg, var(--color-primary), #5D2E0C);
            color: white;
            border: 2px solid var(--color-gold);
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .offer-btn:hover {
            background: linear-gradient(135deg, #5D2E0C, var(--color-primary));
            transform: translateX(5px);
        }

        .offer-btn.active {
            background: linear-gradient(135deg, var(--color-green), var(--color-green-dark));
            border-color: var(--color-green);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
            14% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
            28% { transform: scale(1); }
            42% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
            70% { transform: scale(1); }
        }

        .offer-btn i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .offer-btn.active i {
            transform: rotate(180deg);
        }

        .offer-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
            background: rgba(0,0,0,0.3);
            border-radius: 0 0 15px 15px;
            margin-top: -10px;
            margin-bottom: 10px;
        }

        .offer-content.open {
            max-height: 800px;
            padding: 20px 25px;
        }

        .offer-content p {
            color: #ddd;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .offer-content .not-available {
            color: var(--color-red);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .tamale-input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .tamale-input-group input {
            width: 100px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--color-gold);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 1rem;
        }

        .tamale-total {
            color: var(--color-gold);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .buffet-notice {
            background: rgba(220, 53, 69, 0.15);
            border: 2px solid var(--color-red);
            border-radius: 12px;
            padding: 15px 20px;
            margin: 20px 0;
            text-align: center;
        }

        .buffet-notice p {
            color: var(--color-red);
            font-weight: bold;
            font-size: 1.1rem;
            margin: 0;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .menu-card {
            background: linear-gradient(145deg, var(--color-primary), #5D2E0C);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--color-gold);
        }

        .menu-card h3 {
            color: var(--color-gold);
            font-size: 1.4rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-card .includes {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .menu-card .includes h4 {
            color: var(--color-light);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .menu-card .includes ul {
            list-style: none;
            padding-left: 0;
        }

        .menu-card .includes ul li {
            padding: 3px 0;
            font-size: 0.9rem;
            color: #ddd;
        }

        .menu-card .includes ul li::before {
            content: "✓ ";
            color: var(--color-green);
            font-weight: bold;
        }

        .menu-card .buffet-includes {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .menu-card .buffet-includes h4 {
            color: var(--color-light);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .menu-card .buffet-includes ul {
            list-style: none;
            padding-left: 0;
        }

        .menu-card .buffet-includes ul li {
            padding: 3px 0;
            font-size: 0.9rem;
            color: #ddd;
        }

        .menu-card .buffet-includes ul li::before {
            content: "• ";
            color: var(--color-gold);
            font-weight: bold;
        }

        .menu-card .price {
            font-size: 1.8rem;
            color: var(--color-gold);
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .menu-card .comensales {
            text-align: center;
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .btn-select {
            width: 100%;
            padding: 12px;
            background: var(--color-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-select:hover {
            background: var(--color-green-dark);
            transform: scale(1.02);
        }

        .btn-select.selected { background: var(--color-red); }

        .buffet-section {
            background: linear-gradient(145deg, #4A2510, #2D1405);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            border: 2px dashed var(--color-gold);
        }

        .buffet-section h3 {
            color: var(--color-gold);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .buffet-section p.note {
            text-align: center;
            color: #ccc;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .buffet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .buffet-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .buffet-item label {
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
        }

        .buffet-item .buffet-price {
            color: var(--color-gold);
            font-weight: bold;
        }

        .buffet-item input[type="number"] {
            width: 80px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--color-gold);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 1rem;
        }

        .buffet-item input[type="number"]:focus {
            outline: none;
            border-color: var(--color-green);
        }

        .order-form {
            background: linear-gradient(145deg, var(--color-primary), #5D2E0C);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-gold);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-gold);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #aaa; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .checkbox-group:hover {
            background: rgba(255,255,255,0.05);
        }

        .checkbox-group.error {
            border-color: var(--color-red);
            background: rgba(220, 53, 69, 0.15);
        }

        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--color-green);
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-group label {
            color: var(--color-light);
            font-size: 1rem;
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .delivery-info {
            background: rgba(37, 211, 102, 0.15);
            border: 1px solid var(--color-green);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            display: none;
        }

        .delivery-info.visible { display: block; }

        .delivery-info p {
            color: var(--color-green);
            font-size: 0.9rem;
            margin: 0;
        }

        .mensajeria-error {
            color: var(--color-red);
            font-size: 0.9rem;
            margin-top: 8px;
            display: none;
            font-weight: 600;
            padding: 8px 12px;
            background: rgba(220, 53, 69, 0.15);
            border-radius: 8px;
            border-left: 3px solid var(--color-red);
        }

        .mensajeria-error.visible {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .selected-summary {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 25px 0;
            border: 2px solid var(--color-gold);
        }

        .selected-summary h4 {
            color: var(--color-gold);
            margin-bottom: 15px;
            text-align: center;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .summary-item:last-child { border-bottom: none; }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            margin-top: 10px;
            border-top: 2px solid var(--color-gold);
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--color-gold);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--color-green), var(--color-green-dark));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .voucher-preview {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .voucher-preview.visible { display: block; }

        .voucher-preview h3 {
            color: var(--color-primary);
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--color-gold);
            padding-bottom: 10px;
        }

        .voucher-content {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.8;
            white-space: pre-wrap;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .voucher-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .voucher-actions a,
        .voucher-actions button {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-whatsapp {
            background: var(--color-green);
            color: white;
        }

        .btn-whatsapp:hover { background: var(--color-green-dark); }

        .btn-print {
            background: #6c757d;
            color: white;
        }

        .faq-item {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .faq-question {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .faq-question:hover { background: rgba(255,255,255,0.05); }

        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }

        .faq-answer.open {
            padding: 0 20px 18px;
            max-height: 500px;
        }

        .faq-answer p {
            color: #ccc;
            line-height: 1.7;
        }

        .contact-info {
            text-align: center;
            padding: 30px;

                ...cerdos.map(c => ({ ...c, type: 'cerdo' }))

            allItems.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = `${item.name} - ${item.price.toLocaleString()} CUP`;

        function selectOffer(id, type) {

                    btn.innerHTML = '<i class="fas fa-cart-plus"></i> Seleccionar';

            const items = type === 'porcion' ? porciones : cerdos;
            selectedOffer = items.find(i => i.id === id);

            const card = document.querySelector(`[data-id="${id}"][data-type="${type}"]`);
            const btn = card.querySelector('.btn-select');
            btn.innerHTML = '<i class="fas fa-check"></i> Seleccionado';

        function setupMensajeriaValidation() {

        // ===== CORRECCIÓN PRINCIPAL: Validación del formulario =====
        document.getElementById('orderForm').addEventListener('submit', function(e) {

            // Validación: debe haber al menos una oferta seleccionada (principal O especial)
            const hasMainOffer = selectedOffer !== null;
            const hasSpecialOffers = Object.keys(specialOffers).length > 0;
            
            if (!hasMainOffer && !hasSpecialOffers) {
                showToast('❌ Por favor seleccione una oferta primero', 'error');
                document.getElementById('cenas').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const mensajeriaCheckbox = document.getElementById('mensajeria');
            const mensajeriaGroup = document.getElementById('mensajeriaGroup');
            const mensajeriaError = document.getElementById('mensajeriaError');
            
            if (!mensajeriaCheckbox.hasAttribute('data-touched')) {
                mensajeriaGroup.classList.add('error');
                mensajeriaError.classList.add('visible');
                showToast('❌ Debe indicar si necesita mensajería', 'error');
                mensajeriaGroup.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            const voucherText = buildVoucherText(data);

            document.getElementById('voucherContent').textContent = voucherText;
            document.getElementById('voucherPreview').classList.add('visible');

            const encodedMessage = encodeURIComponent(voucherText);
            const whatsappUrl = `https://wa.me/${OWNER_PHONE}?text=${encodedMessage}`;
            document.getElementById('whatsappLink').href = whatsappUrl;

            document.getElementById('voucherPreview').scrollIntoView({ behavior: 'smooth' });

            showToast('✅ Vale generado. Presione "Enviar por WhatsApp" para completar el pedido.');
        });

        // ===== CORRECCIÓN PRINCIPAL: buildVoucherText con ofertas especiales =====
        function buildVoucherText(data) {
            const now = new Date();
            const fechaActual = now.toLocaleDateString('es-CU');
            const horaActual = now.toLocaleTimeString('es-CU');

            let text = `🍖 *VALE DE VENTA - DON BELLO* 🍖\n`;
            text += `═══════════════════════════════\n\n`;
            text += `📅 *Fecha de emisión:* ${fechaActual} ${horaActual}\n\n`;
            text += `👤 *Cliente:* ${data.nombre}\n`;
            text += `📞 *Teléfono:* ${data.telefono}\n`;
            if (data.telefonoAlt) text += `📞 *Tel. alternativo:* ${data.telefonoAlt}\n`;
            text += `📍 *Dirección:* ${data.direccion}\n\n`;
            text += `📦 *PEDIDO:*\n`;
            text += `───────────────────────────────\n`;

            let total = 0;

            // Oferta principal (del menú de cenas)
            if (selectedOffer) {
                text += `🍽️ ${selectedOffer.name}\n`;
                text += `   Precio: ${selectedOffer.price.toLocaleString()} CUP\n`;
                text += `   Comensales: ${selectedOffer.comensales}\n\n`;
                total += selectedOffer.price;
            }

            // Ofertas especiales (tamales, masas día de las madres)
            Object.entries(specialOffers).forEach(([key, offer]) => {
                const subtotal = offer.qty * offer.price;
                total += subtotal;
                text += `⭐ ${offer.name} x${offer.qty} = ${subtotal.toLocaleString()} CUP\n`;
            });
            if (Object.keys(specialOffers).length > 0) text += `\n`;

            // Buffet adicional
            const buffetEntries = Object.entries(selectedBuffet);
            if (buffetEntries.length > 0) {
                text += `🍰 *BUFFET ADICIONAL:*\n`;
                buffetEntries.forEach(([id, qty]) => {
                    const item = buffetItems.find(b => b.id === id);
                    const subtotal = item.price * qty;
                    total += subtotal;
                    text += `   • ${item.name} x${qty} = ${subtotal.toLocaleString()} CUP\n`;
                });
                text += `\n`;
            }

            // Mensajería
            if (data.mensajeria) {
                text += `🛵 *Mensajería/Delivery:* 5,000 CUP\n`;
                total += 5000;
            }

            text += `\n💰 *TOTAL A PAGAR: ${total.toLocaleString()} CUP*\n\n`;
            text += `📅 *Fecha de entrega:* ${data.fecha}\n`;
            text += `⏰ *Hora de entrega:* ${data.hora}\n\n`;

            if (data.notas) {
                text += `📝 *Notas:* ${data.notas}\n\n`;
            }

            text += `═══════════════════════════════\n`;
            text += `✅ Gracias por preferir Don Bello\n`;
            text += `📞 Contacto: +53 54573045\n`;
            text += `🌐 Comidas Criollas Cuba`;

            return text;
        }

        function toggleOffer(btn, contentId) {
            const content = document.getElementById(contentId);
            const isOpen = content.classList.contains('open');
            
            document.querySelectorAll('.offer-content').forEach(c => c.classList.remove('open'));
            document.querySelectorAll('.offer-btn').forEach(b => b.classList.remove('active'));
            
            if (!isOpen) {
                content.classList.add('open');
                btn.classList.add('active');
            }
        }

        function toggleFaq(element) {
            const answer = element.nextElementSibling;
            const icon = element.querySelector('.fa-chevron-down');
            answer.classList.toggle('open');
            icon.style.transform = answer.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function toggleLegal(element) {
            const answer = element.nextElementSibling;
            const icon = element.querySelector('.fa-chevron-down');
            answer.classList.toggle('open');
            icon.style.transform = answer.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        let currentRating = 0;

        function setupStarRating() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    currentRating = parseInt(this.dataset.value);
                    updateStars();
                });
                star.addEventListener('mouseenter', function() {
                    const val = parseInt(this.dataset.value);
                    stars.forEach((s, i) => {
                        s.classList.toggle('active', i < val);
                    });
                });
            });
            document.getElementById('starContainer').addEventListener('mouseleave', updateStars);
        }

        function updateStars() {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, i) => {
                star.classList.toggle('active', i < currentRating);
            });
        }

        function sendRating() {
            if (currentRating === 0) {
                showToast('❌ Por favor seleccione una calificación', 'error');
                return;
            }
            const comment = document.getElementById('ratingComment').value.trim();
            let message = `⭐ *VALORACIÓN DE SERVICIO - DON BELLO* ⭐\n\n`;
            message += `Calificación: ${'★'.repeat(currentRating)}${'☆'.repeat(5 - currentRating)}\n`;
            message += `Estrellas: ${currentRating}/5\n\n`;
            if (comment) {
                message += `💬 *Comentario:*\n${comment}\n\n`;
            }
            message += `Enviado desde la web de Don Bello`;

            const encoded = encodeURIComponent(message);
            window.open(`https://wa.me/${OWNER_PHONE}?text=${encoded}`, '_blank');
            showToast('✅ Abriendo WhatsApp para enviar su valoración...');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'error' ? '#DC3545' : '#25D366';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function setupEventListeners() {
            document.querySelectorAll('.nav-menu a, .sidebar-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    if (this.getAttribute('href').startsWith('#')) {
                        e.preventDefault();
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSidebar();
                closeLightbox();
            }
        });
    </script>
